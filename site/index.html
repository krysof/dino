<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title>Dino</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { color: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #game { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
    canvas {
      width: 100vw; height: 100vh; display: block; background: #000;
      image-rendering: pixelated; outline: none;
    }
    #launch {
      position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #000;
    }
    button {
      appearance: none; border: 2px solid #d7ff36; border-radius: 4px;
      background: #b9f227; color: #10160d; padding: 14px 32px;
      font: 700 18px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      touch-action: none; user-select: none;
    }
    button:disabled { opacity: .45; }
    #status {
      position: absolute; left: 50%; top: 50%; z-index: 12; display: none;
      max-width: min(90vw, 640px); transform: translate(-50%, -50%);
      padding: 16px 20px; border: 1px solid #ff665f; background: #170605e8;
      color: #ffaaa4; text-align: center;
    }
    #touch { display: none; }
    #stats { display: none; }
    @media (pointer: coarse) {
      #touch.active {
        position: absolute; inset: auto 0 max(12px, env(safe-area-inset-bottom)); z-index: 8;
        display: flex; align-items: end; justify-content: space-between;
        padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
        pointer-events: none;
      }
      #touch button {
        width: 58px; min-width: 58px; height: 52px; padding: 0;
        border-color: #ffffff55; background: #00000066; color: #fff;
        backdrop-filter: blur(3px); pointer-events: auto;
      }
      .dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 52px); gap: 5px; }
      .dpad [data-id="4"] { grid-column: 2; }
      .dpad [data-id="6"] { grid-column: 1; grid-row: 2; }
      .dpad [data-id="5"] { grid-column: 2; grid-row: 2; }
      .dpad [data-id="7"] { grid-column: 3; grid-row: 2; }
      .actions { display: grid; grid-template-columns: repeat(2, 62px); gap: 7px; }
      .actions button { width: 62px; min-width: 62px; }
      .actions .wide { grid-column: span 2; width: 131px; }
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas" width="768" height="576" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="launch"><button id="start" disabled>加载中…</button></div>
    <div id="status" role="alert"></div>
    <div id="touch" aria-label="触摸控制">
      <div class="dpad">
        <button data-port="0" data-id="4">▲</button>
        <button data-port="0" data-id="6">◀</button>
        <button data-port="0" data-id="5">▼</button>
        <button data-port="0" data-id="7">▶</button>
      </div>
      <div class="actions">
        <button data-port="0" data-id="1">攻击</button>
        <button data-port="0" data-id="0">跳跃</button>
        <button data-port="0" data-id="2">投币</button>
        <button data-port="0" data-id="3">开始</button>
      </div>
    </div>
    <div id="stats"></div>
  </div>
  <script>
    const ui = Object.fromEntries(['canvas','launch','start','status','touch','stats'].map(id => [id, document.getElementById(id)]));
    let wasmReady = false, started = false, paused = false;
    function setStatus(message, error = false) {
      if (!error) return;
      ui.status.textContent = message;
      ui.status.style.display = 'block';
    }
    var Module = {
      canvas: ui.canvas,
      print: text => console.log(text),
      printErr: text => console.error(text),
      setStatus() {},
      onRuntimeInitialized() {
        wasmReady = true;
        ui.start.disabled = false;
        ui.start.textContent = '开始';
        if (new URLSearchParams(location.search).has('autostart')) setTimeout(() => ui.start.click(), 0);
      },
      onDinoStatus: setStatus,
      onDinoStats(s) {
        ui.stats.textContent = `${s.frames}/${s.cppInstructions}/${s.audioWrites}/${s.nativeCoverage}`;
        document.body.dataset.nativeFrames = s.frames;
        document.body.dataset.nativeCoverage = s.nativeCoverage;
        document.body.dataset.qsoundWrites = s.audioWrites;
      }
    };
    ui.start.addEventListener('click', () => {
      if (!wasmReady || started) return;
      const result = Module.ccall('dino_start', 'number', ['number'], [0]);
      if (result !== 0) return;
      started = true;
      ui.launch.style.display = 'none';
      ui.touch.classList.add('active');
      ui.canvas.focus();
      const smoke = +new URLSearchParams(location.search).get('smoke');
      if (smoke > 0) Module.ccall('dino_run_smoke_frames', null, ['number'], [smoke]);
    });
    document.querySelectorAll('[data-port][data-id]').forEach(button => {
      const send = pressed => {
        if (started) Module.ccall('dino_set_button', null, ['number','number','number'], [+button.dataset.port,+button.dataset.id,pressed]);
      };
      button.addEventListener('pointerdown', event => {
        event.preventDefault(); button.setPointerCapture(event.pointerId); send(1);
      });
      ['pointerup','pointercancel','lostpointercapture'].forEach(name => button.addEventListener(name, event => {
        event.preventDefault(); send(0);
      }));
    });
    window.addEventListener('keydown', event => {
      if (started && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(event.key)) event.preventDefault();
    }, {passive:false});
    document.addEventListener('visibilitychange', () => {
      if (!started) return;
      const nextPaused = document.hidden;
      if (nextPaused !== paused) {
        paused = nextPaused;
        Module.ccall('dino_set_paused', null, ['number'], [paused ? 1 : 0]);
      }
    });
  </script>
  <script src="dino.js"></script>
</body>
</html>
