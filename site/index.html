<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:,">
  <title>Dino</title>
  <style>
    :root {
      --viewport-left: 0px;
      --viewport-top: 0px;
      --viewport-width: 100vw;
      --viewport-height: 100vh;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --stick-x: 0px;
      --stick-y: 0px;
      --stick-size: 152px;
      --action-size: 73px;
      --control-gap: 9px;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100%; margin: 0; overflow: hidden;
      background: #000; overscroll-behavior: none;
    }
    body {
      min-height: 100vh;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-user-select: none;
      user-select: none;
    }
    @supports (height: 100dvh) {
      body { min-height: 100dvh; }
      :root { --viewport-width: 100dvw; --viewport-height: 100dvh; }
    }
    #app {
      position: fixed;
      left: var(--viewport-left); top: var(--viewport-top);
      width: var(--viewport-width); height: var(--viewport-height);
      overflow: hidden; background: #000;
      touch-action: none;
    }
    #backdrop, #game-layer, #controls-layer, #launch {
      position: absolute; inset: 0;
    }
    #backdrop { background: #000; pointer-events: none; }
    #game-layer { z-index: 2; pointer-events: none; }
    #stage-frame {
      position: absolute;
      left: 50%; top: 50%; width: 384px; height: 224px;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      overflow: hidden; background: #000;
      contain: layout paint size;
    }
    #canvas {
      width: 100% !important; height: 100% !important;
      display: block; margin: 0; border: 0; background: #000;
      image-rendering: pixelated; image-rendering: crisp-edges;
      outline: none; object-fit: contain;
    }
    #pause-overlay {
      position: absolute; inset: 0; z-index: 3;
      display: grid; place-content: center; gap: 8px;
      background: #0009; color: #fff; text-align: center;
      font: 700 24px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
    }
    #pause-overlay small { color: #d7ff36; font-size: 14px; }
    #pause-overlay[hidden] { display: none; }
    #controls-layer {
      z-index: 8; display: none; pointer-events: none;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }
    #controls-layer.active { display: block; }
    #controls-layer[data-layout="portrait-rotated"] {
      inset: auto;
      padding: 0;
      transform-origin: center center;
    }
    #controls-layer, #controls-layer * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #stick-zone {
      position: absolute;
      left: max(12px, var(--safe-left));
      bottom: max(12px, var(--safe-bottom));
      width: var(--stick-size);
      height: var(--stick-size);
      border-radius: 50%;
      pointer-events: auto;
    }
    .stick-base {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid #ffffff52;
      background: radial-gradient(circle, #ffffff19 0 48%, #00000055 49% 100%);
      box-shadow: inset 0 0 0 8px #ffffff0b, 0 2px 16px #000a;
    }
    .stick-cross::before, .stick-cross::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      background: #ffffff24; transform: translate(-50%, -50%);
    }
    .stick-cross::before { width: 72%; height: 1px; }
    .stick-cross::after { width: 1px; height: 72%; }
    #stick-knob {
      position: absolute; left: 50%; top: 50%; width: 48%; height: 48%;
      border: 2px solid #ffffffaa; border-radius: 50%;
      background: #b9f227bb;
      box-shadow: 0 2px 8px #000b;
      transform: translate(-50%, -50%) translate(var(--stick-x), var(--stick-y));
      will-change: transform; pointer-events: none;
    }
    #actions {
      position: absolute;
      right: max(12px, var(--safe-right));
      bottom: max(12px, var(--safe-bottom));
      display: grid;
      grid-template-columns: repeat(2, var(--action-size));
      grid-template-rows: repeat(2, var(--action-size));
      gap: var(--control-gap);
      pointer-events: none;
    }
    .control-button {
      appearance: none; min-width: 0; padding: 0;
      border: 2px solid #ffffff66; border-radius: 50%;
      background: #00000078; color: #fff;
      font: 700 clamp(14px, calc(var(--stick-size) * .105), 19px)/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-shadow: 0 1px 2px #000;
      box-shadow: 0 2px 10px #0009;
      backdrop-filter: blur(3px);
      pointer-events: auto;
    }
    .control-button.primary { border-color: #d7ff3699; background: #668b18a8; }
    .control-button.utility {
      border-radius: 14px;
      font-size: clamp(12px, calc(var(--stick-size) * .085), 16px);
    }
    .control-button.pressed, .control-button:active {
      transform: translateY(1px) scale(.96);
      filter: brightness(1.35);
    }
    #controls-layer[data-layout="portrait-rotated"] #stick-zone {
      left: 12px;
      bottom: 12px;
    }
    #controls-layer[data-layout="portrait-rotated"] #actions {
      right: 12px;
      bottom: 12px;
    }
    #launch {
      z-index: 20; display: grid; place-items: center;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      background: #000;
    }
    .launch-panel {
      display: grid; justify-items: center; gap: 18px;
      max-width: min(92vw, 760px); padding: 20px;
    }
    #start {
      appearance: none; border: 2px solid #d7ff36; border-radius: 5px;
      background: #b9f227; color: #10160d; padding: 14px 32px;
      font: 700 18px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      touch-action: manipulation; user-select: none;
    }
    #start:disabled { opacity: .45; }
    #keyboard-help {
      display: grid; grid-template-columns: auto auto auto auto auto; gap: 7px 18px;
      color: #d6d6d6; font-size: clamp(12px, 1.45vw, 15px); line-height: 1.35;
      text-align: left;
    }
    #keyboard-help strong { color: #d7ff36; }
    #keyboard-help span[role="row"] { display: contents; }
    .pause-help { color: #d6d6d6; font-size: 14px; }
    .pause-help strong { color: #d7ff36; }
    .launch-credit {
      color: #b8e8ff; font-size: clamp(12px, 1.7vw, 16px);
      letter-spacing: .02em; text-align: center;
    }
    @media (pointer: coarse) {
      #keyboard-help { display: none; }
      .pause-help { display: none; }
      #fullscreen { display: none !important; }
    }
    #fullscreen {
      position: absolute; z-index: 16;
      top: max(12px, var(--safe-top)); right: max(12px, var(--safe-right));
      width: 42px; height: 42px; padding: 0;
      border: 1px solid #ffffff66; border-radius: 8px;
      background: #000000a8; color: #fff;
      font: 700 24px/1 sans-serif; cursor: pointer; touch-action: manipulation;
    }
    #fullscreen[hidden] { display: none; }
    #png-debug-legend {
      position: absolute; z-index: 16;
      left: max(12px, var(--safe-left)); top: max(12px, var(--safe-top));
      padding: 7px 10px; border: 1px solid #ff4dff;
      border-radius: 5px; background: #130016d9; color: #fff;
      font: 700 12px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
    }
    #png-debug-legend[hidden] { display: none; }
    #status {
      position: absolute; left: 50%; top: 50%; z-index: 24; display: none;
      max-width: min(90vw, 640px); transform: translate(-50%, -50%);
      padding: 16px 20px; border: 1px solid #ff665f; background: #170605ee;
      color: #ffaaa4; text-align: center;
    }
    #stats { display: none; }
    #safe-probe {
      position: fixed; inset: 0; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    @media (prefers-reduced-motion: reduce) {
      #stick-knob, .control-button { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="backdrop"></div>
    <div id="game-layer">
      <div id="stage-frame" data-rotation="0" data-layout="normal">
        <canvas id="canvas" width="384" height="224" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
        <div id="pause-overlay" role="status" aria-live="polite" hidden>
          <span>已暂停</span><small>按 P 继续</small>
        </div>
      </div>
    </div>
    <div id="controls-layer" aria-label="触摸控制" aria-hidden="true" data-layout="landscape">
      <div id="stick-zone" role="application" aria-label="八方向虚拟摇杆">
        <div class="stick-base stick-cross"></div>
        <div id="stick-knob"></div>
      </div>
      <div id="actions">
        <button class="control-button primary" data-port="0" data-input="1" aria-label="攻击或确认">攻击</button>
        <button class="control-button" data-port="0" data-input="0" aria-label="跳跃或取消">跳跃</button>
        <button class="control-button utility" data-port="0" data-input="2" aria-label="投币">投币</button>
        <button class="control-button utility" data-port="0" data-input="3" aria-label="开始">开始</button>
      </div>
    </div>
    <div id="launch">
      <div class="launch-panel">
        <button id="start" disabled>加载中…</button>
        <div class="launch-credit">http://www.ff18.com　白河愁</div>
        <div id="keyboard-help" role="table" aria-label="MAME 默认键盘布局">
          <span role="row"><strong>玩家</strong><strong>移动</strong><strong>攻击 / 跳跃</strong><strong>投币</strong><strong>开始</strong></span>
          <span role="row"><b>1P</b><span>方向键</span><span>左 Ctrl / 左 Alt</span><span>5</span><span>1</span></span>
          <span role="row"><b>2P</b><span>↑R ↓F ←D →G</span><span>A / S</span><span>6</span><span>2</span></span>
          <span role="row"><b>3P</b><span>↑I ↓K ←J →L</span><span>右 Ctrl / 右 Shift</span><span>7</span><span>3</span></span>
        </div>
        <div class="pause-help"><strong>P</strong>：暂停 / 继续　<strong>F3</strong>：重新开始</div>
      </div>
    </div>
    <button id="fullscreen" type="button" aria-label="进入全屏" title="进入全屏" hidden>⛶</button>
    <div id="png-debug-legend" hidden>原色＝PNG　紫色＝非 PNG 渲染</div>
    <div id="status" role="alert"></div>
    <div id="stats"></div>
    <div id="safe-probe" aria-hidden="true"></div>
  </div>
  <script src="mobile-game-shell.js?v=20260829-png-all-1"></script>
  <script>
    const DINO_ASSET_VERSION = '20260829-png-all-1';
    document.getElementById('png-debug-legend').hidden =
      new URLSearchParams(location.search).get('png-debug') !== '1';
    const ui = Object.fromEntries([
      'app','canvas','stage-frame','controls-layer','stick-zone','stick-knob',
      'safe-probe','launch','start','fullscreen','status','stats','pause-overlay'
    ].map(id => [id, document.getElementById(id)]));
    let wasmReady = false, started = false;
    let manualPaused = false, visibilityPaused = false, paused = false;

    function syncPause() {
      const nextPaused = manualPaused || visibilityPaused;
      if (nextPaused === paused) return;
      paused = nextPaused;
      if (paused) gameShell.releaseAllInputs();
      ui['pause-overlay'].hidden = !paused;
      document.body.dataset.paused = paused ? 'true' : 'false';
      if (started) {
        Module.ccall('dino_set_paused', null, ['number'], [paused ? 1 : 0]);
      }
    }

    function setStatus(message, error = false) {
      if (!error) return;
      ui.status.textContent = message;
      ui.status.style.display = 'block';
    }

    var Module = {
      canvas: ui.canvas,
      locateFile(path, prefix) {
        return `${prefix}${path}?v=${encodeURIComponent(DINO_ASSET_VERSION)}`;
      },
      print: text => console.log(text),
      printErr: text => console.error(text),
      setStatus() {},
      onRuntimeInitialized() {
        wasmReady = true;
        ui.start.disabled = false;
        ui.start.textContent = '开始';
        if (new URLSearchParams(location.search).has('autostart')) {
          setTimeout(() => ui.start.click(), 0);
        }
      },
      onDinoStatus: setStatus,
      onDinoStats(s) {
        ui.stats.textContent = `${s.frames}/${s.cppInstructions}/${s.audioWrites}/${s.nativeCoverage}`;
        document.body.dataset.nativeFrames = s.frames;
        document.body.dataset.nativeCoverage = s.nativeCoverage;
        document.body.dataset.qsoundWrites = s.audioWrites;
        const legend = document.getElementById('png-debug-legend');
        if (!legend.hidden) {
          const renderedPixels = s.pngDebugAuthoredPixels + s.pngDebugGeneratedPixels;
          const ratio = renderedPixels > 0
            ? 100 * s.pngDebugGeneratedPixels / renderedPixels
            : 0;
          const scene = s.singleImageStage > 0
            ? `　第${s.singleImageStage}关/区域${s.singleImageArea}/图${s.singleImageSegment}`
            : '　等待进入关卡';
          const effects = s.singleImageStage > 0
            ? `　调色板${s.singleImagePaletteVariants}${s.singleImageRowScroll ? '＋行滚动' : ''}`
            : '';
          const completeFrames = Module.ccall('dino_get_png_sprite_groups', 'number');
          const tileFallbacks = Module.ccall(
            'dino_get_png_tile_fallback_sprite_groups', 'number');
          legend.textContent = `原色＝PNG　紫色＝非 PNG 渲染 ${ratio.toFixed(1)}%　非PNG像素 ${s.pngDebugGeneratedPixels}/${renderedPixels}　完整帧 ${completeFrames}　PNG图块回退 ${tileFallbacks}　背景动态图块 ${s.singleImageDynamicTiles}/${s.singleImageObservedTiles}　单图片段 ${s.singleImageProbes}${scene}${effects}`;
        }
      }
    };

    const gameShell = new MobileGameShell({
      app: ui.app,
      stage: ui['stage-frame'],
      canvas: ui.canvas,
      controls: ui['controls-layer'],
      stick: ui['stick-zone'],
      knob: ui['stick-knob'],
      safeProbe: ui['safe-probe'],
      config: {
        logicalWidth: 384,
        logicalHeight: 224,
        orientationLock: null,
        rotatePortraitFallback: true,
        controls: {
          directions: 8,
          deadZone: 0.22,
          sensitivity: 1,
          stickSizeMin: 152,
          stickSizeMax: 216,
          stickSizeRatio: 0.31,
          actionSizeMin: 68,
          actionSizeMax: 96,
          actionSizeRatio: 0.48,
          actionGapMin: 8,
          actionGapMax: 12,
          actionGapRatio: 0.06,
          actionChordMs: 160,
          actionChordReleaseMs: 20,
          actionChordHoldMs: 52,
          actionReleaseMargin: 18,
          minimumPressMs: 34
        }
      },
      onInput(port, id, pressed) {
        if (started) Module.ccall(
          'dino_set_button', null,
          ['number','number','number'],
          [port, id, pressed ? 1 : 0]
        );
      }
    });
    window.dinoMobileShell = gameShell;

    function syncFullscreenButton() {
      ui.fullscreen.hidden = !started || gameShell.isFullscreen();
    }

    ui.fullscreen.addEventListener('click', () => {
      gameShell.enterImmersiveOnce().then(syncFullscreenButton);
    });
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(type => {
      document.addEventListener(type, syncFullscreenButton, {passive: true});
    });

    ui.start.addEventListener('click', () => {
      if (!wasmReady || started) return;
      // Fullscreen starts from the user's activation. Rejection is an expected
      // browser policy path and never blocks native runtime startup. Device
      // orientation is deliberately not locked.
      const fullscreenAttempt = gameShell.enterImmersiveOnce();
      const result = Module.ccall('dino_start', 'number', ['number'], [0]);
      if (result !== 0) return;
      started = true;
      document.body.dataset.paused = 'false';
      gameShell.setActive(true);
      ui.launch.style.display = 'none';
      syncFullscreenButton();
      fullscreenAttempt.then(syncFullscreenButton);
      try { ui.canvas.focus({preventScroll: true}); } catch (_) { ui.canvas.focus(); }
      const smoke = Number(new URLSearchParams(location.search).get('smoke'));
      if (smoke > 0) Module.ccall('dino_run_smoke_frames', null, ['number'], [smoke]);
    });

    const mameGameCodes = new Set([
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
      'ControlLeft', 'AltLeft', 'Digit1', 'Digit5',
      'KeyR', 'KeyF', 'KeyD', 'KeyG', 'KeyA', 'KeyS', 'Digit2', 'Digit6',
      'KeyI', 'KeyK', 'KeyJ', 'KeyL', 'ControlRight', 'ShiftRight', 'Digit3', 'Digit7'
    ]);
    const handleGameKeyDown = event => {
      if (!started) return;
      if (mameGameCodes.has(event.code) || event.code === 'KeyP' || event.code === 'F3') {
        event.preventDefault();
      }
      if (event.code === 'F3') {
        if (event.repeat) return;
        gameShell.releaseAllInputs();
        manualPaused = false;
        visibilityPaused = document.hidden;
        paused = false;
        ui['pause-overlay'].hidden = true;
        document.body.dataset.paused = 'false';
        ui.status.textContent = '';
        ui.status.style.display = 'none';
        Module.ccall('dino_reset', null);
        syncPause();
        return;
      }
      if (event.code !== 'KeyP' || event.repeat) return;
      manualPaused = !manualPaused;
      syncPause();
    };
    const handleGameKeyUp = event => {
      if (started && (mameGameCodes.has(event.code) ||
          event.code === 'KeyP' || event.code === 'F3')) {
        event.preventDefault();
      }
    };
    window.addEventListener('keydown', handleGameKeyDown, {passive: false});
    window.addEventListener('keyup', handleGameKeyUp, {passive: false});

    document.addEventListener('visibilitychange', () => {
      if (!started) return;
      visibilityPaused = document.hidden;
      syncPause();
    });
  </script>
  <script src="dino.js?v=20260829-png-all-1"></script>
</body>
</html>
